name: DKB setup zip

# Builds DKB-Setup-<version>-windows.zip (the portable tools, the source and the installer GUI), with no game data.
# A manual run or a push to a tag only uploads the zips as workflow artifacts; a tag named v* also publishes them as a
# GitHub release with the notes of .github/release-notes.md (0.x is experimental, see issue #85).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  zip:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # make_release.py stamps the commit into the version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v5   # make_release.py installs the installer's wheels with uv
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: python tools/check_content.py
      - run: python tools/build_xlate.py
      - run: python tools/make_release.py --game dkb --zip   # also runs check_content over the folder
      - uses: actions/upload-artifact@v4
        with:
          name: DKB-Setup-windows
          path: build/release/DKB-Setup-*-windows.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [zip]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4   # for .github/release-notes.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/DKB-Setup-* --repo "$GITHUB_REPOSITORY" --latest --title "DKB Recomp $GITHUB_REF_NAME" --notes-file .github/release-notes.md --generate-notes
